name: Phase 1 checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Type, unit, config, and policy checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.3

      - name: Use pinned Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use pinned npm
        shell: bash
        run: |
          npm install --global npm@11.16.0
          test "$(npm --version)" = "11.16.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit and contract tests
        run: npm run test:unit

      - name: Verify Expo profiles
        run: npm run verify:config

      - name: Inspect native runtime compatibility
        run: npm run native:check

      - name: Enforce workflow policy
        run: npm run verify:ci
